<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>장바구니</title>
    <style>
        body {
            font-family: 'Noto Sans KR', Arial, sans-serif;
            margin: 0;
            background-color: #f9f9f9;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background-color: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
            color: #2c3e50;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
        }

        th, td {
            text-align: left;
            padding: 15px 10px;
            border-bottom: 1px solid #ddd;
        }

        th {
            background-color: #f4f4f4;
        }

        .actions {
            display: flex;
            flex-direction: row;
            gap: 5px;
            align-items: center;
            justify-content: center;
            min-height: 80px;
        }

        td {
            vertical-align: middle;
        }

        .btn {
            padding: 6px 10px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            color: white;
            font-size: 0.9em;
            min-width: 60px;
            height: 32px;
            line-height: 20px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .btn-update {
            background-color: #3498db;
        }

        .btn-update:hover {
            background-color: #2980b9;
        }

        .btn-delete {
            background-color: #e74c3c;
        }

        .btn-delete:hover {
            background-color: #c0392b;
        }

        .cart-footer {
            margin-top: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0;
            border-top: 1px solid #ddd;
        }
        
        .cart-footer-right {
            display: flex;
            align-items: center;
            gap: 20px;
        }
        
        .total-price {
            font-size: 1.2em;
            font-weight: bold;
            color: #2c3e50;
        }
        
        .btn-order {
            padding: 12px 30px;
            background-color: #27ae60;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1.1em;
            transition: background-color 0.3s;
        }
        
        .btn-order:hover {
            background-color: #219a52;
        }
        
        .back-to-products {
            color: #3498db;
            text-decoration: none;
        }

        .product-image {
            width: 80px;
            height: 80px;
            object-fit: cover;
            border-radius: 4px;
        }
        
        .product-info {
            display: flex;
            align-items: center;
            gap: 15px;
            min-height: 80px;
        }
        
        .product-name {
            font-weight: 500;
        }
        
        th:first-child {
            width: 45%;
        }
        th:nth-child(2) {
            width: 12%;
        }
        th:nth-child(3) {
            width: 15%;
        }
        th:nth-child(4) {
            width: 15%;
        }
        th:last-child {
            width: 13%;
        }

        tr {
            height: 80px;
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
<div th:replace="fragments/header.html :: headerFragment"></div>
<div class="container">
    <h1>장바구니</h1>
    <table>
        <thead>
        <tr>
            <th>상품명</th>
            <th>수량</th>
            <th>가격</th>
            <th>총 가격</th>
            <th>수정/삭제</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="item : ${cartItems}">
            <td>
                <div class="product-info">
                    <!-- TODO: 상품 사진 가져오도록 수정 필요 -->
                    <img class="product-image" 
                         th:src="${item.productImage ?: '/images/default-product.jpg'}" 
                         alt="상품 이미지">
                    <span class="product-name" th:text="${item.productName}">상품명</span>
                </div>
            </td>
            <td>
                <input type="number" th:value="${item.quantity}" min="1" style="width: 60px;">
            </td>
            <td th:text="${#numbers.formatInteger(item.price, 0, 'COMMA') + '원'}">0원</td>
            <td th:text="${#numbers.formatInteger(item.price * item.quantity, 0, 'COMMA') + '원'}">0원</td>
            <td class="actions">
                <button class="btn btn-update" th:onclick="'updateCart(' + ${item.productId} + ')'">수정</button>
                <button class="btn btn-delete" th:onclick="'deleteCart(' + ${item.productId} + ')'">삭제</button>
            </td>
        </tr>
        </tbody>
    </table>
    <div class="cart-footer">
        <a href="/products" class="back-to-products">상품 목록으로 돌아가기</a>
        <div class="cart-footer-right">
            <div class="total-price">
                총 주문금액: <span th:text="${totalPrice ?: 0} + ' 원'">0 원</span>
            </div>
            <button class="btn-order" onclick="location.href='/payment'" 
                    th:onclick="'location.href=\'/payment?cartIds=' + ${cartIds} + '\''">
                주문하기
            </button>
        </div>
    </div>
</div>
</body>
</html>
