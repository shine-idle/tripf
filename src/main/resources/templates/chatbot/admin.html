<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>챗봇 관리자</title>
    <style>
        .admin-container {
            max-width: 1000px;
            margin: 20px auto;
            padding: 20px;
        }
        .category-section {
            margin-bottom: 30px;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        .question-list {
            margin: 15px 0;
        }
        .question-item {
            margin: 5px 0;
            padding: 5px;
            background-color: #f8f9fa;
            border-radius: 3px;
        }
    </style>
</head>
<body>
<div layout:fragment="content">
    <div class="admin-container">
        <h2 class="text-center mb-4">챗봇 관리자 페이지</h2>

        <!-- 새 카테고리 추가 폼 -->
        <div class="card mb-4">
            <div class="card-body">
                <h4>새 카테고리 추가</h4>
                <form id="categoryForm" class="mt-3">
                    <div class="mb-3">
                        <input type="text" class="form-control" id="categoryInput" placeholder="카테고리 이름">
                    </div>
                    <div class="mb-3">
                        <textarea class="form-control" id="questionsInput" rows="3" 
                                placeholder="질문들 (줄바꿈으로 구분)"></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary">카테고리 추가</button>
                </form>
            </div>
        </div>

        <!-- 기존 카테고리 및 질문 목록 -->
        <div class="existing-categories">
            <h4>기존 카테고리 및 질문</h4>
            <div th:each="category : ${questions}" class="category-section">
                <h5 th:text="${category.category}"></h5>
                <div class="question-list">
                    <div th:each="question : ${category.question}" class="question-item">
                        <span th:text="${question}"></span>
                    </div>
                </div>
                <div class="mt-3">
                    <button class="btn btn-sm btn-warning" 
                            th:onclick="'editCategory(\'' + ${category.category} + '\')'">수정</button>
                    <button class="btn btn-sm btn-danger" 
                            th:onclick="'deleteCategory(\'' + ${category.category} + '\')'">삭제</button>
                </div>
            </div>
        </div>
    </div>

    <script th:inline="javascript">
        document.getElementById('categoryForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const category = document.getElementById('categoryInput').value;
            const questions = document.getElementById('questionsInput').value.split('\n');

            fetch('/api/admin/chatbots/questions', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    category: category,
                    questions: questions
                })
            })
            .then(response => response.json())
            .then(data => {
                alert('카테고리가 추가되었습니다.');
                location.reload();
            })
            .catch(error => console.error('Error:', error));
        });

        function editCategory(category) {
            // 카테고리 수정 로직 구현
            console.log('Edit category:', category);
        }

        function deleteCategory(category) {
            if (confirm('정말 삭제하시겠습니까?')) {
                // 카테고리 삭제 로직 구현
                console.log('Delete category:', category);
            }
        }
    </script>
</div>
</body>
</html>
