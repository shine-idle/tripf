<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="layout/default_layout">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>챗봇</title>
    <style>
        .chat-container {
            max-width: 800px;
            margin: 20px auto;
            padding: 20px;
        }
        .chat-box {
            height: 400px;
            border: 1px solid #ddd;
            overflow-y: auto;
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 5px;
        }
        .message {
            margin: 10px 0;
            padding: 10px;
            border-radius: 5px;
        }
        .user-message {
            background-color: #e3f2fd;
            margin-left: 20%;
        }
        .bot-message {
            background-color: #f5f5f5;
            margin-right: 20%;
        }
        .input-group {
            margin-top: 20px;
        }
        .faq-section {
            margin-top: 30px;
        }
        .faq-category {
            margin-bottom: 20px;
        }
        .question-btn {
            margin: 5px;
            padding: 5px 10px;
            border: 1px solid #ddd;
            border-radius: 15px;
            background-color: #f8f9fa;
            cursor: pointer;
        }
    </style>
</head>
<body>
<div layout:fragment="content">
    <div class="chat-container">
        <h2 class="text-center mb-4">Tripf 챗봇 서비스</h2>
        
        <!-- 채팅 내역 표시 영역 -->
        <div class="chat-box" id="chatBox">
            <div th:each="log : ${conversationLogs}">
                <div class="message user-message" th:text="${log.question}"></div>
                <div class="message bot-message" th:text="${log.answer}"></div>
            </div>
        </div>

        <!-- 메시지 입력 영역 -->
        <div class="input-group">
            <input type="text" class="form-control" id="messageInput" placeholder="메시지를 입력하세요...">
            <button class="btn btn-primary" id="sendButton">전송</button>
        </div>

        <!-- 자주 묻는 질문 영역 -->
        <div class="faq-section">
            <h4>자주 묻는 질문</h4>
            <div th:each="questionCategory : ${questions}" class="faq-category">
                <h5 th:text="${questionCategory.category}"></h5>
                <div th:each="question : ${questionCategory.question}">
                    <button class="question-btn"
                            th:text="${question}"
                            th:attr="data-question=${question}"
                            onclick="sendQuestionFromButton(this)"></button>
                </div>
            </div>
        </div>
    </div>

    <script th:inline="javascript">
        function sendQuestion(question) {
            document.getElementById('messageInput').value = question;
            sendMessage();
        }

        function sendMessage() {
            const messageInput = document.getElementById('messageInput');
            const message = messageInput.value;
            
            if (message.trim() === '') return;

            fetch('/api/chatbots/response', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    question: message
                })
            })
            .then(response => response.json())
            .then(data => {
                appendMessage(message, data.answer);
                messageInput.value = '';
                scrollToBottom();
            })
            .catch(error => console.error('Error:', error));
        }

        function sendQuestionFromButton(button) {
            const question = button.getAttribute('data-question');
            document.getElementById('messageInput').value = question;
            sendMessage();
        }

        function appendMessage(question, answer) {
            const chatBox = document.getElementById('chatBox');
            chatBox.innerHTML += `
                <div class="message user-message">${question}</div>
                <div class="message bot-message">${answer}</div>
            `;
        }

        function scrollToBottom() {
            const chatBox = document.getElementById('chatBox');
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        document.getElementById('sendButton').addEventListener('click', sendMessage);
        document.getElementById('messageInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });

        // 페이지 로드 시 스크롤을 맨 아래로
        window.onload = scrollToBottom;
    </script>
</div>
</body>
</html>
