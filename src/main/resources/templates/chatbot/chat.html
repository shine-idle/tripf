<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="layout/default_layout">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>챗봇</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-color: #4a90e2;
            --secondary-color: #f8f9fa;
            --accent-color: #e74c3c;
            --success-color: #2ecc71;
            --text-color: #333;
            --border-color: #ddd;
            --shadow-color: rgba(0, 0, 0, 0.1);
            --transition-speed: 0.3s;
        }

        body {
            font-family: 'Noto Sans KR', sans-serif;
            color: var(--text-color);
            line-height: 1.6;
            background-color: #f5f7fa;
        }

        .chat-container {
            max-width: 1200px;
            margin: 20px auto;
            padding: 20px;
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 20px;
        }

        .sidebar {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 2px 4px var(--shadow-color);
        }

        .main-chat {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 2px 4px var(--shadow-color);
            display: flex;
            flex-direction: column;
        }

        .chat-header {
            padding: 15px;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 15px;
        }

        .chat-box {
            flex: 1;
            height: 500px;
            overflow-y: auto;
            padding: 15px;
            background: var(--secondary-color);
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .message {
            margin: 10px 0;
            padding: 12px 15px;
            border-radius: 10px;
            max-width: 80%;
            position: relative;
            animation: fadeIn 0.3s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .user-message {
            background-color: var(--primary-color);
            color: white;
            margin-left: auto;
            border-bottom-right-radius: 2px;
        }

        .bot-message {
            background-color: white;
            border: 1px solid var(--border-color);
            margin-right: auto;
            border-bottom-left-radius: 2px;
        }

        .message-time {
            font-size: 0.75rem;
            color: #666;
            margin-top: 5px;
            text-align: right;
        }

        .input-group {
            display: flex;
            gap: 10px;
            padding: 15px;
            background: white;
            border-top: 1px solid var(--border-color);
        }

        .input-group input {
            flex: 1;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color var(--transition-speed);
        }

        .input-group input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 2px rgba(74, 144, 226, 0.2);
        }

        .btn {
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 500;
            transition: all var(--transition-speed);
            cursor: pointer;
            border: none;
        }

        .btn-primary {
            background-color: var(--primary-color);
            color: white;
        }

        .btn-primary:hover {
            background-color: #357abd;
        }

        .section-title {
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 15px;
            color: var(--primary-color);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .faq-category {
            margin-bottom: 20px;
            padding: 10px;
            border-radius: 8px;
            background: var(--secondary-color);
        }

        .faq-category h5 {
            color: var(--text-color);
            font-size: 1rem;
            margin-bottom: 10px;
            padding-bottom: 5px;
            border-bottom: 1px solid var(--border-color);
        }

        .question-btn {
            display: block;
            width: 100%;
            text-align: left;
            padding: 8px 12px;
            margin: 5px 0;
            border: none;
            border-radius: 5px;
            background-color: white;
            cursor: pointer;
            transition: all var(--transition-speed);
            font-size: 0.9rem;
        }

        .question-btn:hover {
            background-color: var(--primary-color);
            color: white;
        }

        .conversation-history {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid var(--border-color);
        }

        .history-item {
            padding: 10px;
            margin: 5px 0;
            border-radius: 5px;
            background: var(--secondary-color);
            cursor: pointer;
            transition: background-color var(--transition-speed);
        }

        .history-item:hover {
            background-color: #e9ecef;
        }

        .success-response {
            border-left: 3px solid var(--success-color);
        }

        .failure-response {
            border-left: 3px solid var(--accent-color);
        }

        @media (max-width: 768px) {
            .chat-container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
<div layout:fragment="content">
    <div class="chat-container">
        <!-- 사이드바: FAQ 및 대화 기록 -->
        <div class="sidebar">
            <!-- FAQ 섹션 -->
            <div class="faq-section">
                <h3 class="section-title">
                    <i class="fas fa-question-circle"></i>
                    자주 묻는 질문
                </h3>
                <div th:each="questionCategory : ${questions}" class="faq-category">
                    <h5>
                        <i class="fas fa-folder"></i>
                        <span th:text="${questionCategory.category}"></span>
                    </h5>
                    <div th:each="question : ${questionCategory.question}">
                        <button class="question-btn"
                                th:text="${question}"
                                th:attr="data-question=${question}"
                                onclick="sendQuestionFromButton(this)">
                            <i class="fas fa-comment"></i>
                        </button>
                    </div>
                </div>
            </div>

            <!-- 대화 기록 섹션 -->
            <div class="conversation-history">
                <h3 class="section-title">
                    <i class="fas fa-history"></i>
                    대화 기록
                </h3>
                <div th:each="log : ${conversationLogs}" 
                     th:class="'history-item ' + (${log.responseStatus == 'SUCCESS'} ? 'success-response' : 'failure-response')">
                    <div class="history-question" th:text="${log.question}"></div>
                    <small class="text-muted" th:text="${#temporals.format(log.createdAt, 'yyyy-MM-dd HH:mm')}"></small>
                </div>
            </div>
        </div>

        <!-- 메인 채팅 영역 -->
        <div class="main-chat">
            <div class="chat-header">
                <h2 class="text-center">Tripf 챗봇 서비스</h2>
            </div>
            
            <!-- 채팅 내역 표시 영역 -->
            <div class="chat-box" id="chatBox">
                <div th:each="log : ${conversationLogs}">
                    <div class="message user-message">
                        <div th:text="${log.question}"></div>
                        <div class="message-time" th:text="${#temporals.format(log.createdAt, 'HH:mm')}"></div>
                    </div>
                    <div class="message bot-message">
                        <div th:text="${log.answer}"></div>
                        <div class="message-time" th:text="${#temporals.format(log.createdAt, 'HH:mm')}"></div>
                    </div>
                </div>
            </div>

            <!-- 메시지 입력 영역 -->
            <div class="input-group">
                <input type="text" id="messageInput" placeholder="메시지를 입력하세요...">
                <button class="btn btn-primary" id="sendButton">
                    <i class="fas fa-paper-plane"></i> 전송
                </button>
            </div>
        </div>
    </div>

    <script th:inline="javascript">
        function sendQuestion(question) {
            document.getElementById('messageInput').value = question;
            sendMessage();
        }

        function sendMessage() {
            const messageInput = document.getElementById('messageInput');
            const message = messageInput.value;
            
            if (message.trim() === '') return;

            // 메시지 전송 전 UI 업데이트
            appendMessage(message, null);
            messageInput.value = '';
            scrollToBottom();

            fetch('/api/chatbots/response', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    question: message
                })
            })
            .then(response => response.json())
            .then(data => {
                // 마지막 메시지를 업데이트
                updateLastMessage(data.answer);
                scrollToBottom();
            })
            .catch(error => {
                console.error('Error:', error);
                updateLastMessage('죄송합니다. 오류가 발생했습니다.');
            });
        }

        function sendQuestionFromButton(button) {
            const question = button.getAttribute('data-question');
            sendQuestion(question);
        }

        function appendMessage(question, answer) {
            const chatBox = document.getElementById('chatBox');
            const time = new Date().toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' });
            
            chatBox.innerHTML += `
                <div class="message user-message">
                    <div>${question}</div>
                    <div class="message-time">${time}</div>
                </div>
            `;
            
            if (answer) {
                chatBox.innerHTML += `
                    <div class="message bot-message">
                        <div>${answer}</div>
                        <div class="message-time">${time}</div>
                    </div>
                `;
            }
        }

        function updateLastMessage(answer) {
            const chatBox = document.getElementById('chatBox');
            const time = new Date().toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' });
            
            chatBox.innerHTML += `
                <div class="message bot-message">
                    <div>${answer}</div>
                    <div class="message-time">${time}</div>
                </div>
            `;
        }

        function scrollToBottom() {
            const chatBox = document.getElementById('chatBox');
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        document.getElementById('sendButton').addEventListener('click', sendMessage);
        document.getElementById('messageInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });

        // 페이지 로드 시 스크롤을 맨 아래로
        window.onload = scrollToBottom;
    </script>
</div>
</body>
</html>
